version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    image: work-buddy-app
    platform: linux/arm64
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: postgres:15
    platform: linux/arm64
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: workbuddy
    ports:
      - "5432:5432"
